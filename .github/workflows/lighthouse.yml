name: Lighthouse CI

on:
  push:
    branches: [main, feat/save-work]
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve dist in background
        run: npx http-server ./dist -p 5000 &

      - name: Wait for server
        run: |
          for i in {1..15}; do
            if curl -sS http://localhost:5000 > /dev/null; then echo ok && break; fi
            echo "waiting for server..."; sleep 1;
          done
          curl --fail --silent --show-error http://localhost:5000 > /dev/null

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Run Lighthouse
        run: |
          lighthouse http://localhost:5000 \
            --output json --output-path ./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox"
          lighthouse http://localhost:5000 \
            --output html --output-path ./lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            ./lighthouse-report.json
            ./lighthouse-report.html
