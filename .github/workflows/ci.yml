name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build application
        run: npm run build

  backend-postgres:
    name: Backend build and PostgreSQL verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ingestion_verify
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ingestion_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore IngestionApi.csproj

      - name: Build backend
        run: dotnet build IngestionApi.csproj --no-restore /p:UseAppHost=false -o artifacts/ci-backend

      - name: Verify PostgreSQL schema and repositories
        run: dotnet artifacts/ci-backend/IngestionApi.dll --verify-database
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_PROVIDER: postgres
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=ingestion_verify;Username=postgres;Password=postgres
          OPENAI_API_KEY: verification-key-not-used
          JWT_SECRET: verification-only-secret-at-least-32-characters
          RUN_BACKGROUND_WORKER: 'false'

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce configured audit policy
        run: npm run audit:security
