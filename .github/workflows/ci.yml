name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build application
        run: npm run build

  backend-postgres:
    name: Backend build and PostgreSQL verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ingestion_verify
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ingestion_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore IngestionApi.csproj

      - name: Build backend
        run: dotnet build IngestionApi.csproj --no-restore /p:UseAppHost=false -o artifacts/ci-backend

      - name: Verify bounded caches and distributed rate limiting
        run: dotnet artifacts/ci-backend/IngestionApi.dll --verify-runtime-state
        env:
          REDIS_CONNECTION_STRING: localhost:6379,abortConnect=true

      - name: Start Azurite Blob emulator
        run: >-
          docker run --rm -d --name casepilot-ci-azurite -p 10000:10000
          mcr.microsoft.com/azure-storage/azurite:3.36.0
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck

      - name: Verify PostgreSQL schema and repositories
        run: dotnet artifacts/ci-backend/IngestionApi.dll --verify-database
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_PROVIDER: postgres
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=ingestion_verify;Username=postgres;Password=postgres
          DOCUMENT_STORAGE_PROVIDER: azureblob
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          AZURE_STORAGE_CONTAINER: ci-documents
          OPENAI_API_KEY: verification-key-not-used
          JWT_SECRET: verification-only-secret-at-least-32-characters
          RUN_BACKGROUND_WORKER: 'false'

      - name: Verify worker starts without web authentication settings
        shell: bash
        run: |
          set +e
          timeout 5s dotnet artifacts/ci-backend/IngestionApi.dll --worker
          exit_code=$?
          set -e
          test "$exit_code" -eq 124
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DATABASE_PROVIDER: postgres
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=ingestion_verify;Username=postgres;Password=postgres
          DOCUMENT_STORAGE_PROVIDER: azureblob
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          AZURE_STORAGE_CONTAINER: ci-documents
          OPENAI_API_KEY: verification-key-not-used

      - name: Verify liveness and dependency readiness endpoints
        shell: bash
        run: |
          dotnet artifacts/ci-backend/IngestionApi.dll > /tmp/casepilot-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/casepilot-api.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5055/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:5055/health/live
          curl --fail --show-error http://127.0.0.1:5055/health/ready
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5055
          DATABASE_PROVIDER: postgres
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=ingestion_verify;Username=postgres;Password=postgres
          DOCUMENT_STORAGE_PROVIDER: azureblob
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          AZURE_STORAGE_CONTAINER: ci-documents
          REDIS_CONNECTION_STRING: localhost:6379,abortConnect=true
          OPENAI_API_KEY: verification-key-not-used
          JWT_SECRET: verification-only-secret-at-least-32-characters
          RUN_BACKGROUND_WORKER: 'false'

      - name: Stop Azurite Blob emulator
        if: always()
        run: docker stop casepilot-ci-azurite

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce configured audit policy
        run: npm run audit:security
